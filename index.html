<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能待办清单 PWA</title>
  
  <!-- PWA Manifest 配置 -->
  <link rel="manifest" id="manifest-placeholder">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="待办">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/906/906334.png">

  <!-- 引入 Tailwind CSS & SheetJS (Excel导出库) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    .dragging {
      opacity: 0.5;
      scale: 0.98;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <div class="max-w-md mx-auto px-4 py-6">
    <!-- 头部区域 -->
    <header class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-bold text-indigo-600 flex items-center gap-2">
        <span>📝</span> 待办清单
      </h1>
      <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm px-3 py-1.5 rounded-lg font-medium shadow-sm flex items-center gap-1 transition">
        <span>📊</span> 导出 Excel
      </button>
    </header>

    <!-- iOS / 桌面角标权限提示横幅 -->
    <div id="badge-permission-banner" class="hidden mb-4 p-3 bg-amber-50 border border-amber-200 rounded-xl flex items-center justify-between text-xs text-amber-800">
      <span>🔔 开启角标权限以在桌面图标显示红点数</span>
      <button onclick="requestBadgePermission()" class="bg-amber-600 text-white font-medium px-2.5 py-1 rounded-lg shadow-sm hover:bg-amber-700 transition">
        允许提醒
      </button>
    </div>

    <!-- Tab 切换导航按钮 -->
    <div class="flex border-b border-slate-200 mb-5 bg-white rounded-xl p-1 shadow-sm">
      <button id="tab-btn-1" onclick="switchTab(1)" 
              class="flex-1 py-2 text-center text-sm font-semibold rounded-lg transition-all duration-200 text-indigo-600 bg-indigo-50">
        📋 待办列表
      </button>
      <button id="tab-btn-2" onclick="switchTab(2)" 
              class="flex-1 py-2 text-center text-sm font-semibold rounded-lg transition-all duration-200 text-slate-500 hover:text-slate-800">
        ➕ 添加待办
      </button>
    </div>

    <!-- 第一个 Tab 页面：搜索 + 待办列表 -->
    <div id="tab-content-1" class="space-y-4">
      <!-- 搜索框 -->
      <section>
        <div class="relative">
          <input type="text" id="search-input" oninput="render()" placeholder="🔍 搜索待办事项（单字或关键字）..."
                 class="w-full pl-9 pr-4 py-2 border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
        </div>
      </section>

      <!-- 待办列表 -->
      <main>
        <ul id="todo-list" class="space-y-2.5"></ul>
      </main>
    </div>

    <!-- 第二个 Tab 页面：添加新待办表单 -->
    <div id="tab-content-2" class="hidden">
      <section class="bg-white p-4 rounded-xl shadow-sm mb-6 border border-slate-100">
        <h2 class="text-sm font-semibold text-slate-500 mb-3">添加新待办</h2>
        <form id="todo-form" class="space-y-3" onsubmit="addTodo(event)">
          <input type="text" id="todo-title" placeholder="要做什么事情？" required
                 class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          
          <div class="flex gap-2">
            <div class="flex-1">
              <label class="block text-xs text-slate-400 mb-1">到期日期</label>
              <input type="date" id="todo-due-date" required
                     class="w-full px-2 py-1.5 border border-slate-200 rounded-lg text-xs text-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="flex-1">
              <label class="block text-xs text-slate-400 mb-1">完成日期（可选）</label>
              <input type="date" id="todo-completed-date"
                     class="w-full px-2 py-1.5 border border-slate-200 rounded-lg text-xs text-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
          </div>

          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-2 rounded-lg transition shadow">
            添加项目
          </button>
        </form>
      </section>
    </div>

  </div>

  <script>
    // Tab 切换逻辑
    function switchTab(tabIndex) {
      const tab1Content = document.getElementById('tab-content-1');
      const tab2Content = document.getElementById('tab-content-2');
      const tab1Btn = document.getElementById('tab-btn-1');
      const tab2Btn = document.getElementById('tab-btn-2');

      if (tabIndex === 1) {
        tab1Content.classList.remove('hidden');
        tab2Content.classList.add('hidden');
        
        tab1Btn.className = "flex-1 py-2 text-center text-sm font-semibold rounded-lg transition-all duration-200 text-indigo-600 bg-indigo-50";
        tab2Btn.className = "flex-1 py-2 text-center text-sm font-semibold rounded-lg transition-all duration-200 text-slate-500 hover:text-slate-800";
      } else {
        tab1Content.classList.add('hidden');
        tab2Content.classList.remove('hidden');

        tab2Btn.className = "flex-1 py-2 text-center text-sm font-semibold rounded-lg transition-all duration-200 text-indigo-600 bg-indigo-50";
        tab1Btn.className = "flex-1 py-2 text-center text-sm font-semibold rounded-lg transition-all duration-200 text-slate-500 hover:text-slate-800";
      }
    }

    // 动态生成 Manifest blob 供 PWA 安装使用
    const manifest = {
      name: "待办",
      short_name: "待办",
      start_url: "./",
      display: "standalone",
      background_color: "#f8fafc",
      theme_color: "#4f46e5",
      icons: [{
        src: "https://cdn-icons-png.flaticon.com/512/906/906334.png",
        sizes: "512x512",
        type: "image/png"
      }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(manifestBlob));

    // 数据状态管理
    let todos = JSON.parse(localStorage.getItem('pwa_todos') || '[]');

    // 初始化日期选择器为当天
    const getTodayString = () => new Date().toISOString().split('T')[0];
    document.getElementById('todo-due-date').value = getTodayString();

    // 格式化日期辅助函数
    function parseDate(dateStr) {
      if (!dateStr) return null;
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    // 保存到 LocalStorage
    function save() {
      localStorage.setItem('pwa_todos', JSON.stringify(todos));
    }

    // 添加新项目
    function addTodo(e) {
      e.preventDefault();
      const titleInput = document.getElementById('todo-title');
      const dueDateInput = document.getElementById('todo-due-date');
      const completedDateInput = document.getElementById('todo-completed-date');

      const newTodo = {
        id: Date.now().toString(),
        title: titleInput.value.trim(),
        dueDate: dueDateInput.value,
        completedDate: completedDateInput.value || null,
        completed: false
      };

      todos.unshift(newTodo);
      save();
      render();

      titleInput.value = '';
      dueDateInput.value = getTodayString();
      completedDateInput.value = '';

      switchTab(1);
    }

    // 切换状态
    function toggleComplete(id) {
      const index = todos.findIndex(t => t.id === id);
      if (index === -1) return;

      const todo = todos[index];
      todo.completed = !todo.completed;

      if (todo.completed) {
        if (!todo.completedDate) {
          todo.completedDate = getTodayString();
        }
        todos.splice(index, 1);
        todos.push(todo);
      } else {
        todos.splice(index, 1);
        todos.unshift(todo);
      }

      save();
      render();
    }

    // 删除项目
    function deleteTodo(id) {
      todos = todos.filter(t => t.id !== id);
      save();
      render();
    }

    // 计算状态与颜色逻辑
    function getItemStatus(todo) {
      if (todo.completed) {
        return { bgClass: 'bg-slate-100 opacity-60 border-slate-200', textClass: 'text-slate-400', badge: '已完成', isAlert: false };
      }

      const today = parseDate(getTodayString());
      const due = parseDate(todo.dueDate);
      const diffTime = today - due;
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays === 0) {
        return { 
          bgClass: 'bg-amber-50 border-amber-300', 
          textClass: 'text-amber-800', 
          badge: '今天到期',
          badgeClass: 'bg-amber-100 text-amber-800',
          isAlert: true
        };
      } else if (diffDays >= 2) {
        return { 
          bgClass: 'bg-rose-50 border-rose-300', 
          textClass: 'text-rose-800', 
          badge: `已逾期 ${diffDays} 天`,
          badgeClass: 'bg-rose-100 text-rose-800 font-semibold',
          isAlert: true
        };
      } else if (diffDays === 1) {
        return { 
          bgClass: 'bg-orange-50 border-orange-200', 
          textClass: 'text-orange-800', 
          badge: `已逾期 1 天`,
          badgeClass: 'bg-orange-100 text-orange-800',
          isAlert: true
        };
      }

      return { 
        bgClass: 'bg-white border-slate-100', 
        textClass: 'text-slate-700', 
        badge: null,
        isAlert: false
      };
    }

    // 升级版：设置桌面图标角标（App Badge API）
    async function updateAppBadge() {
      const alertCount = todos.reduce((acc, todo) => {
        const status = getItemStatus(todo);
        return status.isAlert ? acc + 1 : acc;
      }, 0);

      try {
        if ('setAppBadge' in navigator) {
          if (alertCount > 0) {
            await navigator.setAppBadge(alertCount);
          } else {
            await navigator.clearAppBadge();
          }
        } else if ('setExperimentalAppBadge' in navigator) {
          if (alertCount > 0) {
            await navigator.setExperimentalAppBadge(alertCount);
          } else {
            await navigator.clearExperimentalAppBadge();
          }
        }
      } catch (err) {
        console.log('App Badge 设置提示:', err);
      }
    }

    // 请求桌面通知与角标权限（iOS / Safari 必须显式触发）
    async function requestBadgePermission() {
      if ('Notification' in window) {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          document.getElementById('badge-permission-banner').classList.add('hidden');
          updateAppBadge();
        }
      }
    }

    // 检查权限状态
    function checkPermissionBanner() {
      if ('Notification' in window && Notification.permission !== 'granted') {
        document.getElementById('badge-permission-banner').classList.remove('hidden');
      }
    }

    // 渲染视图
    function render() {
      const listEl = document.getElementById('todo-list');
      const searchQuery = document.getElementById('search-input').value.trim().toLowerCase();

      listEl.innerHTML = '';

      // 更新桌面图标角标
      updateAppBadge();

      // 实时搜索过滤
      const filteredTodos = todos.filter(t => t.title.toLowerCase().includes(searchQuery));

      if (filteredTodos.length === 0) {
        listEl.innerHTML = `<li class="text-center py-8 text-slate-400 text-sm">暂无匹配的待办事项</li>`;
        return;
      }

      filteredTodos.forEach((todo) => {
        const status = getItemStatus(todo);
        const li = document.createElement('li');
        li.dataset.id = todo.id;
        li.draggable = true;
        li.className = `p-3 rounded-xl border ${status.bgClass} shadow-sm transition-all flex items-center justify-between gap-3 cursor-move group`;

        li.innerHTML = `
          <div class="flex items-center gap-3 flex-1 min-w-0">
            <input type="checkbox" ${todo.completed ? 'checked' : ''} 
                   onclick="toggleComplete('${todo.id}')"
                   class="w-5 h-5 rounded text-indigo-600 focus:ring-indigo-500 cursor-pointer">
            
            <div class="min-w-0 flex-1">
              <p class="text-sm font-medium ${todo.completed ? 'line-through text-slate-400' : 'text-slate-800'} break-words">
                ${escapeHtml(todo.title)}
              </p>
              
              <div class="flex flex-wrap items-center gap-2 mt-1 text-xs text-slate-400">
                <span>到期: ${todo.dueDate}</span>
                ${todo.completedDate ? `<span>| 完成: ${todo.completedDate}</span>` : ''}
                ${status.badge ? `<span class="px-1.5 py-0.5 rounded ${status.badgeClass}">${status.badge}</span>` : ''}
              </div>
            </div>
          </div>

          <button onclick="deleteTodo('${todo.id}')" class="text-slate-300 hover:text-rose-500 p-1 rounded transition">
            🗑️
          </button>
        `;

        addDragEvents(li);
        listEl.appendChild(li);
      });
    }

    // HTML转义防XSS
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    // 拖拽排序逻辑
    let dragSrcId = null;

    function addDragEvents(item) {
      item.addEventListener('dragstart', (e) => {
        dragSrcId = item.dataset.id;
        item.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });

      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
      });

      item.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      });

      item.addEventListener('drop', (e) => {
        e.preventDefault();
        const targetId = item.dataset.id;
        if (dragSrcId && dragSrcId !== targetId) {
          const fromIndex = todos.findIndex(t => t.id === dragSrcId);
          const toIndex = todos.findIndex(t => t.id === targetId);
          
          const [movedItem] = todos.splice(fromIndex, 1);
          todos.splice(toIndex, 0, movedItem);

          save();
          render();
        }
      });
    }

    // 导出 Excel
    function exportToExcel() {
      if (todos.length === 0) {
        alert('当前没有待办事项可导出！');
        return;
      }

      const excelData = todos.map((t, index) => {
        const status = getItemStatus(t);
        return {
          "序号": index + 1,
          "待办事项": t.title,
          "到期日期": t.dueDate,
          "完成日期": t.completedDate || '未完成',
          "状态": t.completed ? '已完成' : (status.badge || '进行中')
        };
      });

      const worksheet = XLSX.utils.json_to_sheet(excelData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "待办清单");

      worksheet['!cols'] = [{ wch: 6 }, { wch: 30 }, { wch: 15 }, { wch: 15 }, { wch: 15 }];

      const dateStr = new Date().toISOString().split('T')[0];
      XLSX.writeFile(workbook, `待办事项清单_${dateStr}.xlsx`);
    }

    // 注册 Service Worker (iOS PWA 显示桌面角标的核心依赖)
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => self.clients.claim());
        self.addEventListener('message', e => {
          if (e.data && e.data.type === 'SET_BADGE') {
            if (navigator.setAppBadge) navigator.setAppBadge(e.data.count);
          }
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    // 页面初始化
    checkPermissionBanner();
    render();
  </script>
</body>
</html>
